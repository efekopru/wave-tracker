<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DNX3 - Wave Tracker</title>
<style>
@font-face{font-family:'SF Pro Text';src:url('/static/fonts/SF-Pro-Text-Regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'SF Pro Text';src:url('/static/fonts/SF-Pro-Text-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'SF Pro Text';src:url('/static/fonts/SF-Pro-Text-Semibold.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'SF Pro Text';src:url('/static/fonts/SF-Pro-Text-Bold.otf') format('opentype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'SF Pro Display';src:url('/static/fonts/SF-Pro-Display-Regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'SF Pro Display';src:url('/static/fonts/SF-Pro-Display-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'SF Pro Display';src:url('/static/fonts/SF-Pro-Display-Semibold.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'SF Pro Display';src:url('/static/fonts/SF-Pro-Display-Bold.otf') format('opentype');font-weight:700;font-style:normal;font-display:swap;}
/* ═══════════════════════════════════════════════════
   macOS 27 DESIGN SYSTEM — DESIGN TOKENS
   ═══════════════════════════════════════════════════ */
*{transition:background-color .35s ease,border-color .35s ease,color .35s ease,box-shadow .35s ease;}:root{
  /* Semantic colors — light mode */
  --green:#34c759;--green-bg:rgba(52,199,89,.12);--green-border:rgba(52,199,89,.35);--green-text:#1a7a36;
  --red:#ff3b30;--red-bg:rgba(255,59,48,.1);--red-border:rgba(255,59,48,.4);--red-text:#a00000;
  --yellow:#ff9f0a;--yellow-bg:rgba(255,159,10,.1);--yellow-border:rgba(255,159,10,.3);
  --blue:#007aff;--blue-bg:rgba(0,122,255,.1);--blue-border:rgba(0,122,255,.3);
  --teal:#5ac8fa;--purple:#af52de;--indigo:#5856d6;

  /* Surfaces */
  --bg:#f2f2f7;
  --surface:rgba(255,255,255,.82);
  --surface2:rgba(242,242,247,.75);
  --surface3:rgba(255,255,255,.55);
  --surface-solid:#ffffff;
  --glass-bg:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.55);

  /* Text */
  --text:#000000;
  --text2:#3c3c43;
  --subtext:rgba(60,60,67,.6);
  --subtext2:rgba(60,60,67,.3);

  /* Borders */
  --border:rgba(60,60,67,.12);
  --border2:rgba(60,60,67,.2);
  --separator:rgba(60,60,67,.29);

  /* Header */
  --header-bg:rgba(248,248,252,.85);
  --header-border:rgba(60,60,67,.15);

  /* Sidebar */
  --sidebar-w:256px;

  /* Radii — iOS 27 uses more generous rounding */
  --radius:18px;
  --radius-md:14px;
  --radius-sm:12px;
  --radius-xs:10px;
  --radius-pill:999px;

  /* Shadows — soft, layered */
  --shadow:0 2px 8px rgba(0,0,0,.06),0 8px 32px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.1),0 12px 40px rgba(0,0,0,.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,.14),0 24px 64px rgba(0,0,0,.1);

  /* Accent */
  --accent:#007aff;
  --accent-glow:rgba(0,122,255,.2);

  /* Transitions */
  --tr:160ms cubic-bezier(.4,0,.2,1);
  --tr-spring:400ms cubic-bezier(.34,1.56,.64,1);
}

/* ── DARK MODE ── */
.dark{
  --bg:#000000;
  --surface:rgba(28,28,30,.9);
  --surface2:rgba(44,44,46,.85);
  --surface3:rgba(58,58,60,.6);
  --surface-solid:#1c1c1e;
  --glass-bg:rgba(28,28,30,.78);
  --glass-border:rgba(255,255,255,.1);
  --text:#ffffff;
  --text2:#ebebf5;
  --subtext:rgba(235,235,245,.6);
  --subtext2:rgba(235,235,245,.25);
  --border:rgba(255,255,255,.1);
  --border2:rgba(255,255,255,.16);
  --separator:rgba(84,84,88,.65);
  --header-bg:rgba(22,22,24,.88);
  --header-border:rgba(255,255,255,.1);
  --green:#30d158;--green-bg:rgba(48,209,88,.15);--green-border:rgba(48,209,88,.4);--green-text:#a8f5bc;
  --red:#ff453a;--red-bg:rgba(255,69,58,.15);--red-border:rgba(255,69,58,.4);--red-text:#ffd0cd;
  --yellow-bg:rgba(255,159,10,.14);--yellow-border:rgba(255,159,10,.35);
  --blue:#0a84ff;--blue-bg:rgba(10,132,255,.15);--blue-border:rgba(10,132,255,.35);
  --shadow:0 2px 8px rgba(0,0,0,.4),0 8px 32px rgba(0,0,0,.35);
  --shadow-md:0 4px 16px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.4);
  --shadow-lg:0 8px 32px rgba(0,0,0,.65),0 24px 64px rgba(0,0,0,.5);
  --accent:#0a84ff;--accent-glow:rgba(10,132,255,.25);
}

/* ═══════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--separator);border-radius:var(--radius-pill);}

/* ═══════════════════════════════════════════════════
   LOGIN — iOS 27 card sheet
   ═══════════════════════════════════════════════════ */
#login-screen{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;
  transition:background .3s;
}
/* Subtle gradient orbs behind login card */
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 600px 400px at 30% 20%, rgba(0,122,255,.07) 0%, transparent 70%),
    radial-gradient(ellipse 500px 300px at 75% 75%, rgba(175,82,222,.05) 0%, transparent 70%);
  pointer-events:none;
}
.login-box{
  background:var(--glass-bg);
  backdrop-filter:blur(40px) saturate(160%);
  -webkit-backdrop-filter:blur(40px) saturate(160%);
  border-radius:28px;
  padding:44px 48px;width:380px;
  box-shadow:var(--shadow-lg);
  border:1px solid var(--glass-border);
  position:relative;
}
.login-icon{
  width:60px;height:60px;
  background:var(--accent);
  border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:22px;
  box-shadow:0 4px 20px var(--accent-glow);
}
.login-icon svg{width:26px;height:26px;}
.login-logo{font-size:1.45rem;font-weight:700;color:var(--text);margin-bottom:3px;letter-spacing:-.04em;}
.login-sub{font-size:.8rem;color:var(--subtext);margin-bottom:32px;font-weight:400;}
.login-label{font-size:.68rem;font-weight:600;color:var(--subtext);margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:.07em;}
.login-input{
  width:100%;padding:14px 16px;
  border:1.5px solid var(--border2);
  border-radius:var(--radius-sm);
  font-size:.92rem;outline:none;margin-bottom:14px;
  background:rgba(255,255,255,.6);color:var(--text);
  font-family:inherit;
  transition:border-color var(--tr),box-shadow var(--tr),background var(--tr);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.dark .login-input{background:rgba(44,44,46,.6);}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow);}.pw-wrap{position:relative;margin-bottom:14px;}.pw-wrap .login-input{margin-bottom:0;padding-right:44px;}.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--subtext);padding:4px;border-radius:4px;display:flex;align-items:center;}.pw-eye:hover{color:var(--text);}
.login-btn{
  width:100%;padding:14px;
  background:var(--accent);color:#fff;
  border:none;border-radius:var(--radius-sm);
  font-size:.93rem;font-weight:600;cursor:pointer;font-family:inherit;
  transition:opacity var(--tr),transform var(--tr),box-shadow var(--tr);
  letter-spacing:-.015em;
  box-shadow:0 2px 12px var(--accent-glow);
}
.login-btn:hover{opacity:.9;box-shadow:0 4px 20px var(--accent-glow);}
.login-btn:active{transform:scale(.97);opacity:.95;}
.login-error{font-size:.75rem;color:var(--red);margin-top:10px;min-height:18px;text-align:center;}
.login-role{display:inline-block;margin-top:12px;font-size:.7rem;padding:3px 10px;border-radius:var(--radius-pill);font-weight:600;}
.role-associate{background:var(--blue-bg);color:var(--blue);}
.role-manager{background:var(--yellow-bg);color:var(--yellow);}

/* ═══════════════════════════════════════════════════
   HEADER — iOS 27 frosted glass bar
   ═══════════════════════════════════════════════════ */
header{
  background:var(--header-bg);
  backdrop-filter:saturate(200%) blur(28px);
  -webkit-backdrop-filter:saturate(200%) blur(28px);
  color:var(--text);
  height:56px;
  display:flex;align-items:center;padding:0 18px;gap:10px;
  flex-shrink:0;
  border-bottom:1px solid var(--header-border);
  position:relative;z-index:100;
}
.logo{font-size:.94rem;font-weight:700;letter-spacing:-.03em;}
.subtitle{font-size:.66rem;color:var(--subtext);margin-top:1px;font-weight:400;letter-spacing:.01em;}
.hright{margin-left:auto;display:flex;align-items:center;gap:7px;}

/* ── GLASS TAB PILL BAR ── */
.tab-pills{
  display:flex;align-items:center;
  background:var(--surface2);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-radius:12px;padding:3px;gap:0;
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 1px 4px rgba(0,0,0,.07);
  position:relative;
  /* Needed for absolute indicator positioning */
}
/* The sliding glass pill indicator */
.tab-indicator{
  position:absolute;
  top:3px;bottom:3px;
  background:var(--glass-bg);
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  border-radius:9px;
  box-shadow:0 1px 6px rgba(0,0,0,.12),0 0 0 0.5px rgba(255,255,255,.5) inset;
  border:0.5px solid var(--glass-border);
  transition:left .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
  z-index:0;
}
.tab-btn{
  padding:5px 13px;
  border-radius:9px;border:none;
  background:transparent;
  color:var(--subtext);cursor:pointer;
  font-size:.73rem;font-weight:600;
  transition:color .2s;
  font-family:inherit;white-space:nowrap;letter-spacing:-.01em;
  position:relative;z-index:1;
  /* No box-shadow here — the indicator pill provides the background */
}
.tab-btn.active{color:var(--text);font-weight:600;}
.tab-btn:hover:not(.active){color:var(--text2);}

/* ── SEARCH inside tab bar ── */
.tab-search{
  height:28px;padding:0 10px;
  border:1px solid var(--border2);
  border-radius:9px;
  font-size:.73rem;font-family:inherit;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--text);outline:none;width:140px;
  transition:border-color .2s,box-shadow .2s;
  margin-right:3px;
  position:relative;z-index:1;
}
.dark .tab-search{background:rgba(44,44,46,.55);}
.tab-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.tab-search::placeholder{color:var(--subtext);}

/* ── ICON BUTTONS ── */
.icon-btn{
  background:rgba(0,0,0,.05);
  border:none;color:var(--subtext);
  border-radius:7px;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--tr),color var(--tr);
  width:30px;height:30px;flex-shrink:0;
}
.icon-btn:hover{background:rgba(0,0,0,.09);color:var(--text);}
.dark .icon-btn{background:rgba(255,255,255,.08);}
.dark .icon-btn:hover{background:rgba(255,255,255,.14);}
.icon-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.clock{font-size:.73rem;font-variant-numeric:tabular-nums;color:var(--subtext);min-width:56px;text-align:right;font-weight:500;letter-spacing:.01em;}
.role-badge{font-size:.63rem;padding:3px 9px;border-radius:var(--radius-pill);font-weight:600;}
.rb-associate{background:var(--blue-bg);color:var(--blue);}
.rb-manager{background:var(--yellow-bg);color:var(--yellow);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:3px;flex-shrink:0;}
.sync-dot.off{background:var(--red);}
.sync-status{font-size:.63rem;color:var(--subtext);display:flex;align-items:center;gap:2px;}

/* ═══════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════ */
.layout{display:flex;flex:1;overflow:hidden;}

/* ═══════════════════════════════════════════════════
   SIDEBAR — glass panel
   ═══════════════════════════════════════════════════ */
aside{
  width:var(--sidebar-w);
  background:var(--glass-bg);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
  transition:width .32s cubic-bezier(.4,0,.2,1);
}
aside.collapsed{width:38px;}
.stitle,.missing-scroll{
  opacity:1;
  transition:opacity .18s cubic-bezier(.4,0,.2,1);
}
aside.collapsed .stitle,
aside.collapsed .missing-scroll{opacity:0;pointer-events:none;transition:opacity .1s cubic-bezier(.4,0,.2,1);}
.sidebar-toggle{
  width:100%;padding:10px 0;
  background:none;border:none;
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:background var(--tr);
}
.sidebar-toggle:hover{background:var(--surface2);}
.sidebar-toggle svg{width:14px;height:14px;fill:none;stroke:var(--subtext);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .32s cubic-bezier(.4,0,.2,1);}
aside.collapsed .sidebar-toggle svg{transform:rotate(180deg);}
.stitle{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--subtext);padding:14px 14px 5px;}
.missing-scroll{flex:1;overflow-y:auto;padding:3px 0;}
.mwhdr{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;cursor:pointer;background:none;border:none;width:100%;color:var(--text);transition:background var(--tr);}
.mwhdr:hover{background:var(--surface2);}
.mwlabel{font-size:.72rem;font-weight:600;}
.mwcount{font-size:.6rem;background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--radius-pill);padding:1px 7px;color:var(--red);font-weight:700;}
.chevron{font-size:.55rem;color:var(--subtext2);transition:transform .2s;margin-left:4px;}
.mwhdr.open .chevron{transform:rotate(90deg);}
.mwbody{padding:2px 14px 8px;display:none;}
.mwbody.open{display:block;}
.mr{font-size:.74rem;padding:3px 0;color:var(--text);display:flex;align-items:center;gap:6px;}
.mrdot{width:5px;height:5px;border-radius:50%;background:var(--red);flex-shrink:0;}
.mrdsp{color:var(--subtext);font-size:.66rem;font-weight:500;}
.nomiss{font-size:.72rem;color:var(--subtext);padding:10px 14px;}

/* ═══════════════════════════════════════════════════
   WAVE ACCORDION — glass cards
   ═══════════════════════════════════════════════════ */
.wave-accordion{
  background:var(--glass-bg);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border-radius:var(--radius);
  border:1px solid var(--glass-border);
  margin-bottom:10px;overflow:hidden;
  box-shadow:var(--shadow);
}
.wave-acc-hdr{
  display:flex;align-items:center;
  padding:13px 16px;cursor:pointer;
  background:none;border:none;width:100%;color:var(--text);
  font-family:inherit;gap:10px;
  transition:background var(--tr);
}
.wave-acc-hdr:hover,.wave-acc-hdr.open{background:rgba(255,255,255,.12);}
.dark .wave-acc-hdr:hover,.dark .wave-acc-hdr.open{background:rgba(255,255,255,.06);}
.wave-acc-body{display:none;}
.wave-acc-body.open{display:block;}
.wah-time{font-size:.88rem;font-weight:700;letter-spacing:-.02em;}
.wah-prog{margin-left:auto;display:flex;align-items:center;gap:8px;}
.wah-plbl{font-size:.73rem;color:var(--subtext);font-weight:500;}
.wah-bar-w{width:72px;height:4px;background:var(--border2);border-radius:var(--radius-pill);overflow:hidden;}
.wah-bar{height:100%;border-radius:var(--radius-pill);background:var(--green);transition:width .4s ease;}
.wah-chev{font-size:.55rem;color:var(--subtext2);transition:transform .2s;margin-left:4px;}
.wave-acc-hdr.open .wah-chev{transform:rotate(90deg);}
.wah-badges{display:flex;gap:4px;}

/* ═══════════════════════════════════════════════════
   ROUTE GRID & CARDS — iOS 27 glass cards
   ═══════════════════════════════════════════════════ */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px;}
.rcard{
  background:var(--glass-bg);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  padding:12px 13px;cursor:pointer;
  transition:transform var(--tr),box-shadow var(--tr),background var(--tr),border-color var(--tr);
  position:relative;overflow:hidden;
}
/* Left accent bar */
.rcard::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  border-radius:0;transition:background var(--tr);
  background:var(--border2);
}
.rcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.rcard:active{transform:scale(.97);}

/* Staging colors */
.rcard.staging-bd{background:rgba(52,199,89,.1);border-color:var(--green-border);}
.dark .rcard.staging-bd{background:rgba(48,209,88,.13);}
.rcard.staging-bd::before{background:var(--green);}
.rcard.staging-bd .cr{color:var(--green-text);font-weight:700;}
.dark .rcard.staging-bd .cr{color:var(--green-text);}
.rcard.staging-ac{background:rgba(255,59,48,.08);border-color:var(--red-border);}
.dark .rcard.staging-ac{background:rgba(255,69,58,.12);}
.rcard.staging-ac::before{background:var(--red);}
.rcard.staging-ac .cr{color:var(--red-text);font-weight:700;}
.dark .rcard.staging-ac .cr{color:var(--red-text);}
.rcard.checked{background:rgba(120,120,128,.1)!important;border-color:rgba(120,120,128,.25)!important;opacity:.55;filter:saturate(0.15);}
.rcard.checked::before{background:rgba(120,120,128,.4)!important;}
.rcard.dimmed{opacity:.2;pointer-events:none;}
.rcard.otd-flagged{background:rgba(255,59,48,.15)!important;border-color:var(--red-border)!important;}
.rcard.otd-flagged::before{background:var(--red)!important;}

.cr{font-size:.82rem;font-weight:700;letter-spacing:-.015em;margin-bottom:2px;}
.cs{font-size:.66rem;color:var(--subtext);font-weight:500;}
.ck{font-size:.69rem;font-weight:600;color:var(--green);margin-top:4px;}
.ct{font-size:.61rem;color:var(--subtext2);margin-top:2px;}
.cd{font-size:.61rem;color:var(--subtext);margin-top:1px;}

/* ═══════════════════════════════════════════════════
   PILLS & BADGES
   ═══════════════════════════════════════════════════ */
.pills{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
.pill{font-size:.59rem;font-weight:600;padding:2px 7px;border-radius:var(--radius-pill);letter-spacing:.02em;}
.pill.pg{background:var(--green-bg);color:var(--green);}
.pill.pr{background:var(--red-bg);color:var(--red);}
.pill.py{background:var(--yellow-bg);color:var(--yellow);}
.pill.pd{background:var(--blue-bg);color:var(--blue);}
.pill.pt{background:var(--surface2);color:var(--subtext);border:1px solid var(--border);}
.bm{font-size:.59rem;font-weight:700;padding:2px 7px;border-radius:var(--radius-pill);}
.bm-done{background:var(--green-bg);color:var(--green);}
.bm-late{background:var(--red-bg);color:var(--red);}
.bm-miss{background:var(--surface2);color:var(--subtext);border:1px solid var(--border);}

<!-- Glass tab indicator JS — runs after app.js sets up tabs -->
<script>
(function(){
  function positionIndicator(animate){
    var pills = document.getElementById('tab-pills');
    var indicator = document.getElementById('tab-indicator');
    if(!pills || !indicator) return;
    var active = pills.querySelector('.tab-btn.active');
    if(!active) return;
    if(!animate){
      indicator.style.transition = 'none';
    }
    indicator.style.left  = active.offsetLeft + 'px';
    indicator.style.width = active.offsetWidth + 'px';
    if(!animate){
      // Force reflow then restore transition
      indicator.getBoundingClientRect();
      indicator.style.transition = '';
    }
  }

  // Patch switchTab to move indicator
  var _orig = window.switchTab;
  window.switchTab = function(t){
    if(_orig) _orig(t);
    // Give the active class a tick to settle then slide
    requestAnimationFrame(function(){
      positionIndicator(true);
    });
  };

  // Initial position — wait for header to be visible
  var attempts = 0;
  function tryInit(){
    var header = document.getElementById('main-header');
    if(header && header.style.display !== 'none'){
      positionIndicator(false);
    } else if(attempts++ < 60){
      setTimeout(tryInit, 100);
    }
  }
  tryInit();

  // Also reposition on window resize
  window.addEventListener('resize', function(){ positionIndicator(false); });

  // Expose for app.js to call after showUI()
  window.initTabIndicator = function(){ positionIndicator(false); };
})();
</script>
